version: '3.8'

services:
  client:
    image: sea-battle-client-staging
    build:
      context: .
      dockerfile: client/web/Dockerfile
    ports:
      - '8080:80'
    restart: always
    depends_on:
      - server
    networks:
      - sea-battle-network

  server:
    image: sea-battle-server-staging
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '8081:3000'
    restart: always
    env_file:
      - .env.staging
    environment:
      - NODE_ENV=staging
      - PORT=3000
    networks:
      - sea-battle-network

networks:
  sea-battle-network:
    driver: bridge
